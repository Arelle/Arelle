<!doctype html>
<html lang="{{ .Site.Language.Locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=https://arelle.readthedocs.io/">
    <link rel="canonical" href="https://arelle.readthedocs.io/">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <meta name="description" content="{{ .Description }}">
    {{- with resources.Get "images/favicon.ico" }}
      <link rel="icon" type="image/x-icon" href="{{ .RelPermalink }}" sizes="32x32">
    {{- end }}
    {{- with resources.Get "images/favicon.svg" }}
      <link rel="icon" type="image/svg+xml" href="{{ .RelPermalink }}">
    {{- end }}
  </head>
  <body>
    {{ .Content }}
  </body>
</html>
