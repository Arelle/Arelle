version: 2
updates:
  - package-ecosystem: docker
    cooldown:
      default-days: 1
    directories:
      - /**
    schedule:
      interval: weekly
    allow:
      - dependency-name: "python"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 1
    directories:
      - /**
    schedule:
      interval: weekly
    groups:
      gha-dependencies:
        patterns:
          - "*"
  - package-ecosystem: nuget
    cooldown:
      default-days: 1
    directories:
      - /**
    schedule:
      interval: weekly
    groups:
      dotnet-dependencies:
        patterns:
          - "*"
  - package-ecosystem: pip
    cooldown:
      default-days: 1
    directories:
      - /**
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "cx_Freeze"
