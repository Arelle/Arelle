name: Get Test Scripts Matrix
description: Find test scripts. Output matrix in JSON format.
outputs:
  matrix:
    description: Matrix to use for initiating jobs.
    value: ${{ steps.find.outputs.matrix }}

runs:
  using: composite
  steps:
    - id: find
      shell: bash
      run: |
        echo 'matrix<<EOF' >> $GITHUB_OUTPUT
        cat <<'JSON'
        [
            {
                "artifact_name": "probe-nonexistent logs",
                "environment": "none",
                "name": "probe_nonexistent_test",
                "os": "ubuntu-24.04",
                "python_version": "3.12"
            }
        ]
        JSON
        echo EOF >> $GITHUB_OUTPUT
