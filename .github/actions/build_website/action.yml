name: Build Website
description: Builds the arelle.org site and iXBRL Viewer demo.

inputs:
  download_version:
    default: ''
    description: Release version to render in download links (blank for the latest-release locator)
    required: false
  base_url:
    default: 'https://arelle.org/'
    description: Base URL to build the site against
    required: false

runs:
  using: composite
  steps:
    - name: Install Hugo
      shell: bash
      run: sudo snap install hugo --channel=extended --classic
    - name: Install Node
      uses: actions/setup-node@v7.0.0
      with:
        cache: 'npm'
        cache-dependency-path: docs/website/package-lock.json
        check-latest: true
        node-version: '26'
    - name: Install Python
      uses: actions/setup-python@v7.0.0
      with:
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-plugins.txt
        python-version: '3.14'
    - name: Install dependencies
      shell: bash
      working-directory: docs/website
      run: npm ci
    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt -r requirements-plugins.txt
    - name: Build website
      shell: bash
      working-directory: docs/website
      env:
        BASE_URL: ${{ inputs.base_url }}
        HUGO_PARAMS_downloadVersion: ${{ inputs.download_version }}
        HUGO_PARAMS_releaseRepository: ${{ github.repository }}
      run: hugo --minify --baseURL "$BASE_URL"
    - name: Generate iXBRL Viewer demo
      shell: bash
      working-directory: docs/website
      env:
        BASE_URL: ${{ inputs.base_url }}
      run: python scripts/generate_viewer_demo.py --base-url "$BASE_URL"
