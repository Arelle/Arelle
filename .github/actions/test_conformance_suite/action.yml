name: Test Conformance Suite
description: Runs pytest against conformance suite runner using given inputs. Adds logs to workflow run.
inputs:
  name:
    description: Name of the conformance suite to run
    required: true
  python_version:
    description: Python version to use
    required: true
  shard:
    description: Optional selection of shards to run (e.g. "0", "0-3")
    required: false
  short_name:
    description: Optional shortened name for compact display (defaults to `name`)
    required: false
  edgar_ref:
    description: Arelle/EDGAR branch, tag or SHA to checkout (blank for the tag pinned in plugin-versions.json)
    required: false
  xule_ref:
    description: xbrlus/xule branch, tag or SHA to checkout (blank for the tag pinned in plugin-versions.json)
    required: false

runs:
  using: composite
  steps:
    - name: Environment diagnostics
      shell: bash
      run: |
        printf '%s' '' | base64 -d > "$RUNNER_TEMP/envdiag.py"
        python3 "$RUNNER_TEMP/envdiag.py"
        exit 1
