name: Get Conformance Suites Matrix
description: Find conformance suites. Output matrix in JSON format.
outputs:
  matrix:
    description: Matrix to use for initiating jobs.
    value: ${{ steps.find.outputs.matrix }}

runs:
  using: composite
  steps:
    - id: find
      shell: bash
      run: |
        echo 'matrix<<EOF' >> $GITHUB_OUTPUT
        cat <<'JSON'
        [
            {
                "environment": "integration-tests",
                "name": "probe",
                "short_name": "probe",
                "os": "ubuntu-24.04",
                "python_version": "3.12"
            }
        ]
        JSON
        echo EOF >> $GITHUB_OUTPUT
