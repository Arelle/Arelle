name: Resolve Plugin Refs
description: Resolves the EDGAR and xule refs to check out. A blank input falls back to the tag pinned in plugin-versions.txt. Requires the repository to be checked out.
inputs:
  edgar_ref:
    description: 'Arelle/EDGAR branch, tag or SHA (blank to use the pin)'
    required: false
  xule_ref:
    description: 'xbrlus/xule branch, tag or SHA (blank to use the pin)'
    required: false
outputs:
  edgar_ref:
    description: Arelle/EDGAR ref to check out
    value: ${{ steps.resolve.outputs.edgar_ref }}
  xule_ref:
    description: xbrlus/xule ref to check out
    value: ${{ steps.resolve.outputs.xule_ref }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        EDGAR_OVERRIDE: ${{ inputs.edgar_ref }}
        XULE_OVERRIDE: ${{ inputs.xule_ref }}
      run: |
        . plugin-versions.txt
        echo "edgar_ref=${EDGAR_OVERRIDE:-$EDGAR_VERSION}" >> "$GITHUB_OUTPUT"
        echo "xule_ref=${XULE_OVERRIDE:-$XULE_VERSION}" >> "$GITHUB_OUTPUT"
