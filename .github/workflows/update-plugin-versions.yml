name: Update Plugin Versions

# Detects new releases of the external plugins and opens a PR updating plugin-versions.json.

on:
  schedule:
    # Run daily at 7 AM (UTC) or at 2 AM (EST)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  update:
    name: Update ${{ matrix.plugin.name }} pin
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - name: EDGAR
            key: EDGAR_VERSION
            repository: Arelle/EDGAR
          - name: xule
            key: XULE_VERSION
            repository: xbrlus/xule
    env:
      GH_TOKEN: ${{ github.token }}
      PLUGIN_NAME: ${{ matrix.plugin.name }}
      PLUGIN_KEY: ${{ matrix.plugin.key }}
      PLUGIN_REPOSITORY: ${{ matrix.plugin.repository }}
    steps:
      - name: Checkout arelle
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Find latest release
        id: latest
        run: |
          current=$(jq -r --arg key "$PLUGIN_KEY" '.[$key]' plugin-versions.json)
          latest=$(gh api "repos/${PLUGIN_REPOSITORY}/releases/latest" --jq .tag_name)
          echo "current=$current latest=$latest"
          # Only move forward: skip when the pin is already the newest (or newer, e.g. a manual bump).
          if [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)" = "$current" ]; then
            echo "Pin is up to date."
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "current=$current" >> "$GITHUB_OUTPUT"
            echo "latest=$latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for existing PR
        id: existing
        if: steps.latest.outputs.update == 'true'
        env:
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          branch="plugin-version/${PLUGIN_NAME}-${LATEST}"
          # --state all also counts merged or closed PRs, so a declined bump is not reopened.
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json number --jq length)
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "exists=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Open PR
        if: steps.latest.outputs.update == 'true' && steps.existing.outputs.exists == 'false'
        env:
          BRANCH: ${{ steps.existing.outputs.branch }}
          CURRENT: ${{ steps.latest.outputs.current }}
          LATEST: ${{ steps.latest.outputs.latest }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          jq --arg key "$PLUGIN_KEY" --arg version "$LATEST" '.[$key] = $version' plugin-versions.json > plugin-versions.json.tmp
          mv plugin-versions.json.tmp plugin-versions.json
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$BRANCH"
          git add plugin-versions.json
          git commit -m "Update ${PLUGIN_NAME} plugin to ${LATEST}"
          # The branch is bot-owned; overwrite any leftover from a run that failed before the PR was created.
          git push --force origin "$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$BRANCH" \
            --title "Update ${PLUGIN_NAME} plugin to ${LATEST}" \
            --body "Bumps the ${PLUGIN_NAME} pin in \`plugin-versions.json\` from \`${CURRENT}\` to \`${LATEST}\`: https://github.com/${PLUGIN_REPOSITORY}/releases/tag/${LATEST}"
